name: Build Android Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Godot settings
        run: |
          mkdir -p "$HOME/.local/share/godot" "$HOME/.config/godot"
          cp -r /root/.local/share/godot/export_templates "$HOME/.local/share/godot/" || true
          cp -r /root/.config/godot/. "$HOME/.config/godot/" || true

      - name: Generate debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore debug.keystore \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12

      - name: Validate project in Godot headless
        run: |
          godot --headless --quit --path .

      - name: Export Android Debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/kruglosutochniy.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kruglosutochniy-android-debug
          path: build/kruglosutochniy.apk
          if-no-files-found: error
